name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ocx-manager/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ocx-manager/desktop/package-lock.json

      - run: npm ci

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocx-switcher-${{ runner.os }}
          path: |
            ocx-manager/desktop/dist/*.exe
            ocx-manager/desktop/dist/*.zip
            ocx-manager/desktop/dist/*.AppImage
            ocx-manager/desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
