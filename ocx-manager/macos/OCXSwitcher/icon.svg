<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.18" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8ab4ff"/>
      <stop offset="0.45" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="core" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="430" r="420" fill="url(#glow)"/>

  <!-- Anneau discret évoquant le routage multi-providers -->
  <circle cx="512" cy="470" r="252" fill="none" stroke="#2b3a5c" stroke-width="6" stroke-dasharray="18 26" stroke-linecap="round" opacity="0.55"/>
  <circle cx="280" cy="330" r="17" fill="#4f8cff" opacity="0.9"/>
  <circle cx="770" cy="620" r="21" fill="#7c5cff" opacity="0.9"/>
  <circle cx="740" cy="300" r="11" fill="#8ab4ff" opacity="0.65"/>

  <!-- Éclair principal -->
  <g filter="url(#shadow)">
    <path d="M 598 128 L 322 580 H 478 L 408 900 L 716 462 H 558 L 700 128 Z"
          fill="url(#bolt)"/>
    <path d="M 560 190 L 372 540 H 484 L 432 772 L 640 418 H 528 L 634 190 Z"
          fill="url(#core)" opacity="0.55"/>
  </g>
</svg>
